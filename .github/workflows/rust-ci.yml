name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  teacher-console:
    name: ubuntu-latest (Teacher Console typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/teacher/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir apps/teacher install --ignore-scripts --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm --dir apps/teacher exec tsc --noEmit
      # Production-сборка ловит то, чего не видит tsc: ошибки бандлера,
      # недостающие ассеты и импорты, существующие только в типах.
      - name: Production build
        run: pnpm --dir apps/teacher build

  cloud:
    name: ubuntu-latest (Cloud v0)
    runs-on: ubuntu-latest
    # Реальный PostgreSQL: без него адаптер только компилировался бы, а
    # расхождение с in-memory реализацией всплыло бы на развёртывании.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: classos
          POSTGRES_USER: classos
          POSTGRES_DB: classos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://classos:classos@localhost:5432/classos_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: services/cloud
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
        working-directory: services/cloud
      - name: bun test
        run: bun test
        working-directory: services/cloud
      - name: Проверить, что тесты PostgreSQL не пропущены
        # Пропущенный из-за отсутствия DATABASE_URL набор выглядит как
        # успешный прогон, поэтому его отсутствие проверяется явно.
        run: |
          bun test test/postgres.test.ts 2>&1 | tee /tmp/pg-test.log
          grep -qE "^ *[1-9][0-9]* pass" /tmp/pg-test.log
          if grep -qE "^ *[1-9][0-9]* skip" /tmp/pg-test.log; then
            echo "Тесты PostgreSQL пропущены — DATABASE_URL не подхвачен" >&2
            exit 1
          fi
        working-directory: services/cloud

  windows:
    name: windows-latest (build + test + lint)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: cargo test
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: cargo build --release
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      # Backend Teacher Console — отдельный Cargo workspace, поэтому команды
      # выше его не покрывают. Без этих шагов его Rust-код не проверялся бы
      # нигде: CI фронтенда делает только tsc.
      - name: cargo fmt --check (Teacher Console backend)
        run: cargo fmt --manifest-path apps/teacher/src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy (Teacher Console backend)
        run: cargo clippy --manifest-path apps/teacher/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (Teacher Console backend)
        run: cargo test --manifest-path apps/teacher/src-tauri/Cargo.toml

  powershell:
    name: windows-latest (PowerShell lint)
    runs-on: windows-latest
    # Установка, релиз и прогон приёмки целиком написаны на PowerShell, и до
    # этой джобы ни одна строка не проверялась нигде: опечатка в
    # install-classos.ps1 всплыла бы на чистой машине в кабинете.
    steps:
      - uses: actions/checkout@v4

      - name: Разбор синтаксиса всех скриптов
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -File | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "== $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok: $($_.Name)"
            }
          }
          if ($failed) { throw "PowerShell-скрипты не разбираются" }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse `
            -Severity Error, Warning `
            -Settings scripts/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer нашёл $($issues.Count) замечаний"
          }
          Write-Host "замечаний нет"

  console-bundle:
    name: windows-latest (Teacher Console installer)
    runs-on: windows-latest
    # Установщик консоли — то, что получает преподаватель. Ошибки упаковки
    # (иконки, имя продукта, конфигурация бандлера) не видны ни tsc, ни
    # cargo test: они проявляются только на сборке инсталлятора.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/teacher/pnpm-lock.yaml

      # Backend консоли зависит от крейта protocol, а тот генерирует типы из
      # proto-схем на сборке. Без protoc падает не тест, а сам бандл.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/teacher/src-tauri

      - name: Install frontend dependencies
        run: pnpm --dir apps/teacher install --ignore-scripts --frozen-lockfile

      - name: Build installer
        run: pnpm --dir apps/teacher exec tauri build

      - name: Проверить, что установщик действительно собран
        # Успешный exit code бандлера ещё не означает файл на диске.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "apps/teacher/src-tauri/target/release/bundle"
          $installers = Get-ChildItem $bundle -Recurse -Include *.exe, *.msi -ErrorAction SilentlyContinue
          if (-not $installers) { throw "Установщик не найден в $bundle" }
          $installers | ForEach-Object { Write-Host "$($_.Name) — $([math]::Round($_.Length / 1MB, 1)) МБ" }

      - uses: actions/upload-artifact@v4
        with:
          name: classos-console-installer
          path: |
            apps/teacher/src-tauri/target/release/bundle/nsis/*.exe
            apps/teacher/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  service-smoke:
    name: windows-latest (service install/start smoke test)
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Stage release binaries at target\release
        # Скрипт установки ожидает target\release, а target MSVC использует
        # отдельный вложенный каталог.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\classos-service.exe target\release\
          Copy-Item target\x86_64-pc-windows-msvc\release\classos-session.exe target\release\
          Copy-Item target\x86_64-pc-windows-msvc\release\classos-updater.exe target\release\

      # Механическая часть блока T0 чеклиста приёмки. Раннер имеет
      # консольную сессию, поэтому Session Host здесь действительно
      # запускается и его перезапуск замеряется. Вход и выход пользователя,
      # блокировка экрана, перезагрузка и вторая учётная запись остаются за
      # человеком — скрипт помечает их NOT-RUN.
      - name: Прогнать механическую часть T0
        shell: pwsh
        run: .\scripts\acceptance-t0.ps1 -IdleSeconds 60 -RestartCycles 5

      - name: Показать журнал службы
        if: always()
        shell: pwsh
        run: |
          $log = Get-ChildItem "C:\ProgramData\ClassOS\logs" -Filter "service.log*" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) { Get-Content $log.FullName -Tail 80 } else { Write-Host "журнала нет" }

      - name: Снять службу, если прогон прервался
        if: always()
        shell: pwsh
        run: |
          if (Get-Service -Name ClassOSAgent -ErrorAction SilentlyContinue) {
            .\scripts\uninstall-service.ps1 -Purge
          }

  # Независимая от ОС часть workspace должна собираться и тестироваться на
  # Linux. windows-platform намеренно исключён.
  host-portable:
    name: ubuntu-latest (host-portable subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (host-portable subset)
        run: cargo clippy --workspace --exclude windows-platform --all-targets -- -D warnings

      - name: cargo test (host-portable subset)
        run: cargo test --workspace --exclude windows-platform
