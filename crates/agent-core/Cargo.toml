[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
policy-engine = { version = "0.1.0", path = "../policy-engine" }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
software-manager = { version = "0.1.0", path = "../software-manager" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.5"
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4"] }
