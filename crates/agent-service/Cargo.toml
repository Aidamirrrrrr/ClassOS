[package]
name = "agent-service"
version = "0.1.0"
edition.workspace = true

[lib]
name = "agent_service"
path = "src/lib.rs"

[[bin]]
name = "classos-service"
path = "src/main.rs"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
windows-platform = { version = "0.1.0", path = "../windows-platform" }
windows-service = "0.8.1"

[dependencies]
agent-core = { version = "0.1.0", path = "../agent-core" }
clap = { version = "4.6.6", features = ["derive"] }
protocol = { version = "0.1.0", path = "../protocol" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }
