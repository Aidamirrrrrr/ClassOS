[package]
name = "transport"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
fastrand = "2.5.0"
getrandom = "0.4.3"
prost = "0.14.4"
protocol = { version = "0.1.0", path = "../protocol" }
rcgen = "0.14.10"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
zeroize = "1.9.0"
