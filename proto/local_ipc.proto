syntax = "proto3";

package classos.local.v1;

// Envelope оборачивает каждое сообщение локального IPC между Service и
// Session Host (T0 §51). Length-prefixed framing реализован вне этой схемы.
message Envelope {
  string message_id = 1;

  oneof payload {
    SessionHello session_hello = 10;
    ServiceHello service_hello = 11;

    Ping ping = 12;
    Pong pong = 13;

    GetSessionInfo get_session_info = 14;
    SessionInfo session_info = 15;

    Shutdown shutdown = 16;
  }
}

// Session Host отправляет сообщение сразу после подключения (T0 §52).
// Service не доверяет заявленным session_id/pid и проверяет их через WinAPI.
message SessionHello {
  uint32 protocol_version = 1;
  uint32 session_id = 2;
  uint32 pid = 3;
}

// Ответ Service на проверенный SessionHello (T0 §53).
message ServiceHello {
  uint32 protocol_version = 1;
  string service_instance_id = 2;
}

// Проверка heartbeat от Service к Session Host (T0 §54, §62).
message Ping {
  uint64 sequence = 1;
  int64 sent_at_unix_ms = 2;
}

// Ответ heartbeat от Session Host к Service (T0 §55).
message Pong {
  uint64 sequence = 1;
}

// Запрос текущего SessionInfo. Сессия однозначно определяется соединением,
// поэтому тело сообщения пустое.
message GetSessionInfo {}

// Состояние сессии (T0 §56). Продуктовые поля намеренно исключены из T0.
message SessionInfo {
  uint32 session_id = 1;
  uint32 pid = 2;

  string username = 3;

  bool is_locked = 4;
}

// Уведомление о штатной остановке от Service к Session Host (T0 §74).
message Shutdown {}
