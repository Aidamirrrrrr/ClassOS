syntax = "proto3";

package classos.local.v1;

// Envelope оборачивает каждое сообщение локального IPC между Service и
// Session Host (T0 §51). Length-prefixed framing реализован вне этой схемы.
message Envelope {
  string message_id = 1;

  oneof payload {
    SessionHello session_hello = 10;
    ServiceHello service_hello = 11;

    Ping ping = 12;
    Pong pong = 13;

    GetSessionInfo get_session_info = 14;
    SessionInfo session_info = 15;

    Shutdown shutdown = 16;
    CaptureRequest capture_request = 17;
    Frame frame = 18;
    CaptureError capture_error = 19;
    RemoteControlStart remote_control_start = 20;
    RemoteControlStop remote_control_stop = 21;
    RemoteInputEvent remote_input_event = 22;
  }
}

// Session Host отправляет сообщение сразу после подключения (T0 §52).
// Service не доверяет заявленным session_id/pid и проверяет их через WinAPI.
message SessionHello {
  uint32 protocol_version = 1;
  uint32 session_id = 2;
  uint32 pid = 3;
}

// Ответ Service на проверенный SessionHello (T0 §53).
message ServiceHello {
  uint32 protocol_version = 1;
  string service_instance_id = 2;
}

// Проверка heartbeat от Service к Session Host (T0 §54, §62).
message Ping {
  uint64 sequence = 1;
  int64 sent_at_unix_ms = 2;
}

// Ответ heartbeat от Session Host к Service (T0 §55).
message Pong {
  uint64 sequence = 1;
}

// Запрос текущего SessionInfo. Сессия однозначно определяется соединением,
// поэтому тело сообщения пустое.
message GetSessionInfo {}

// Состояние сессии (T0 §56). Продуктовые поля намеренно исключены из T0.
message SessionInfo {
  uint32 session_id = 1;
  uint32 pid = 2;

  string username = 3;

  bool is_locked = 4;
}

// Уведомление о штатной остановке от Service к Session Host (T0 §74).
message Shutdown {}

// Запрос единичного кадра от Service к Session Host.
message CaptureRequest {
  uint32 display_id = 1;
  // Нулевое значение сохраняет поведение T2: кадр исходной ширины.
  uint32 max_width = 2;
  // Нулевое значение использует качество JPEG по умолчанию Session Host.
  uint32 jpeg_quality = 3;
}

// Закодированный кадр, возвращаемый Session Host после захвата.
message Frame {
  uint32 display_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes encoded_data = 4;
  string format = 5;
}

// Безопасная для UI ошибка захвата без диагностических деталей драйвера.
message CaptureError {
  string code = 1;
  string message = 2;
}

message RemoteControlStart { string session_id = 1; }
message RemoteControlStop { string reason = 1; }

message RemoteInputEvent {
  oneof event {
    MouseMove mouse_move = 10;
    MouseButton mouse_button = 11;
    MouseWheel mouse_wheel = 12;
    KeyEvent key_event = 13;
  }
}

message MouseMove { float x = 1; float y = 2; }
message MouseButton {
  enum Button { LEFT = 0; RIGHT = 1; MIDDLE = 2; }
  Button button = 1;
  bool is_down = 2;
  float x = 3;
  float y = 4;
}
message MouseWheel { int32 delta = 1; }
message KeyEvent { uint32 virtual_key_code = 1; bool is_down = 2; }
