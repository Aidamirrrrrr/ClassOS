syntax = "proto3";

package classos.network.v1;

// Публичное и недоверенное объявление устройства в локальной сети.
message ClassOSDeviceAnnouncement {
  uint32 protocol_version = 1;
  string device_id = 2;
  string hostname = 3;
  string room_hint = 4;
  string agent_version = 5;
  string ip = 6;
  uint32 control_port = 7;
}

// Envelope оборачивает сетевые сообщения между Teacher Console и Student Agent.
message Envelope {
  uint32 protocol_version = 1;
  string message_id = 2;
  int64 timestamp_ms = 3;

  oneof payload {
    DeviceHello device_hello = 10;
    TeacherHello teacher_hello = 11;
    EnrollmentRequest enrollment_request = 12;
    EnrollmentResult enrollment_result = 13;
    DeviceStatus device_status = 14;
    Heartbeat heartbeat = 15;
    UpgradeRequired upgrade_required = 16;
    ScreenshotRequest screenshot_request = 17;
    ScreenFrame screen_frame = 18;
    CaptureError capture_error = 19;
    StreamSubscribe stream_subscribe = 20;
    StreamUnsubscribe stream_unsubscribe = 21;
    RemoteControlStart remote_control_start = 22;
    RemoteControlStarted remote_control_started = 23;
    RemoteControlStop remote_control_stop = 24;
    RemoteControlStopped remote_control_stopped = 25;
    RemoteInputEvent remote_input_event = 26;
    Command command = 27;
    CommandResult command_result = 28;
  }
}

// Начальное описание Student Agent и поддерживаемого им диапазона протокола.
message DeviceHello {
  string device_id = 1;
  string hostname = 2;
  string agent_version = 3;
  string os_version = 4;
  repeated string capabilities = 5;
  uint32 min_protocol = 6;
  uint32 max_protocol = 7;
}

// Начальное описание Teacher Console и поддерживаемого ей диапазона протокола.
message TeacherHello {
  string teacher_session_id = 1;
  uint32 min_protocol = 2;
  uint32 max_protocol = 3;
  bytes authorization_credential = 4;
  bytes signature = 5;
}

// Запрос локального enrollment. Публичный ключ передаётся в формате DER.
message EnrollmentRequest {
  string enrollment_code = 1;
  string device_id = 2;
  bytes device_public_key_der = 3;
  string organization_id = 4;
  string branch_id = 5;
  bytes device_certificate_der = 6;
}

// Результат enrollment с машиночитаемым кодом и данными локального issuer.
message EnrollmentResult {
  bool success = 1;
  EnrollmentErrorCode error_code = 2;
  bytes issued_credential = 3;
  bytes issuer_public_key_der = 4;
  int64 expires_at_unix_ms = 5;
}

// Минимальный живой статус устройства в рамках T1.
message DeviceStatus {
  string device_id = 1;
  DeviceOnlineState state = 2;
  string agent_version = 3;
}

// Heartbeat поддерживает обнаружение потери соединения в обе стороны.
message Heartbeat {
  uint64 sequence = 1;
  int64 sent_at_unix_ms = 2;
}

// Явный ответ при отсутствии общей версии протокола.
message UpgradeRequired {
  uint32 min_protocol = 1;
  uint32 max_protocol = 2;
}

// Запрос единичного кадра через уже аутентифицированный T1-канал.
message ScreenshotRequest {
  string device_id = 1;
  uint32 display_id = 2;
}

// JPEG-кадр от Session Host через Service к Teacher Console.
message ScreenFrame {
  string device_id = 1;
  uint32 display_id = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes encoded_data = 5;
  string format = 6;
  int64 captured_at_unix_ms = 7;
  StreamMode mode = 8;
  uint32 sequence = 9;
}

// Ошибка единичного capture без внутренних диагностических деталей.
message CaptureError {
  string code = 1;
  string message = 2;
}

// Подписка Teacher на adaptive screen stream.
message StreamSubscribe {
  string device_id = 1;
  StreamMode mode = 2;
  uint32 target_fps = 3;
  uint32 max_width = 4;
}

// Отмена подписки обязательна при закрытии окна или соединения.
message StreamUnsubscribe {
  string device_id = 1;
}

message RemoteControlStart { string device_id = 1; }
message RemoteControlStarted { string device_id = 1; string session_id = 2; }
message RemoteControlStop { string device_id = 1; }
message RemoteControlStopped { string device_id = 1; string reason = 2; }

message RemoteInputEvent {
  string device_id = 1;
  oneof event {
    MouseMove mouse_move = 10;
    MouseButton mouse_button = 11;
    MouseWheel mouse_wheel = 12;
    KeyEvent key_event = 13;
  }
}

message MouseMove { float x = 1; float y = 2; }
message MouseButton {
  enum Button { LEFT = 0; RIGHT = 1; MIDDLE = 2; }
  Button button = 1;
  bool is_down = 2;
  float x = 3;
  float y = 4;
}
message MouseWheel { int32 delta = 1; }
message KeyEvent { uint32 virtual_key_code = 1; bool is_down = 2; }

message Command {
  string command_id = 1;
  int64 expires_at_unix_ms = 2;
  oneof body {
    LockDevice lock_device = 10;
    UnlockDevice unlock_device = 11;
    ShowMessage show_message = 12;
    LaunchApplication launch_application = 13;
    OpenUrl open_url = 14;
    RestartDevice restart_device = 15;
    ShutdownDevice shutdown_device = 16;
    ApplyPolicy apply_policy = 17;
    RollbackPolicy rollback_policy = 18;
    FocusModeEnable focus_mode_enable = 19;
    FocusModeDisable focus_mode_disable = 20;
  }
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string error_code = 3;
  string message = 4;
}

message LockDevice {}
message UnlockDevice {}
message ShowMessage { string text = 1; }
message LaunchApplication { string application_id = 1; }
message OpenUrl { string url = 1; }
message RestartDevice {}
message ShutdownDevice {}
message ApplyPolicy { string policy_id = 1; bytes compiled_policy = 2; }
message RollbackPolicy { string snapshot_id = 1; }
message FocusModeEnable { repeated string allowed_application_ids = 1; }
message FocusModeDisable {}

enum EnrollmentErrorCode {
  ENROLLMENT_ERROR_CODE_UNSPECIFIED = 0;
  ENROLLMENT_ERROR_CODE_INVALID = 1;
  ENROLLMENT_ERROR_CODE_EXPIRED = 2;
  ENROLLMENT_ERROR_CODE_ALREADY_USED = 3;
  ENROLLMENT_ERROR_CODE_IDENTITY_MISMATCH = 4;
  ENROLLMENT_ERROR_CODE_INTERNAL = 5;
}

enum DeviceOnlineState {
  DEVICE_ONLINE_STATE_UNSPECIFIED = 0;
  DEVICE_ONLINE_STATE_ONLINE = 1;
  DEVICE_ONLINE_STATE_OFFLINE = 2;
}

enum StreamMode {
  STREAM_MODE_UNSPECIFIED = 0;
  STREAM_MODE_THUMBNAIL = 1;
  STREAM_MODE_SELECTED = 2;
}
