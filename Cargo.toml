[workspace]
resolver = "2"

members = [
    "crates/agent-service",
    "crates/agent-session",
    "crates/agent-core",
    "crates/protocol",
    "crates/transport",
    "crates/screen-capture",
    "crates/remote-input",
    "crates/windows-platform",
    "crates/policy-engine",
    "crates/device-health",
    "crates/software-manager", "crates/updater",
]

[workspace.package]
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
